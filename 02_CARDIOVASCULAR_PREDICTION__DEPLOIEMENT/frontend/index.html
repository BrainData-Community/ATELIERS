<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prédiction Cardiovasculaire</title>

  <style>
    :root {
      --background: #0f172a;
      --surface: rgba(15, 23, 42, 0.95);
      --accent: #5b8def;
      --accent-soft: #8fb7ff;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --danger: #fb7185;
      --success: #34d399;
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, rgba(91, 141, 239, 0.28), transparent 40%),
        linear-gradient(180deg, #020617 0%, #111827 100%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .app {
      width: min(100%, 980px);
      background: var(--surface);
      border: 1px solid rgba(148, 163, 184, 0.18);
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.4);
      overflow: hidden;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 24px;
    }

    header h1 {
      font-size: clamp(1.9rem, 2.5vw, 2.8rem);
      letter-spacing: -0.04em;
    }

    header p {
      max-width: 520px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .field {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .field label {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .field input,
    .field select {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 12px 14px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      font-size: 0.98rem;
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid rgba(91, 141, 239, 0.45);
      outline-offset: 2px;
    }

    button {
      width: 100%;
      max-width: 240px;
      background: linear-gradient(135deg, var(--accent), #2dd4bf);
      border: none;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      padding: 16px 22px;
      border-radius: 999px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 18px 50px rgba(91, 141, 239, 0.22);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 60px rgba(91, 141, 239, 0.28);
    }

    .result {
      margin-top: 28px;
      padding: 26px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.8));
      border: 1px solid rgba(255, 255, 255, 0.06);
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
    }

    .result h2 {
      font-size: 1.55rem;
      margin-bottom: 6px;
    }

    .result p {
      color: var(--muted);
      line-height: 1.7;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.12);
      color: #a7f3d0;
      font-size: 0.95rem;
      width: fit-content;
    }

    .loading {
      color: var(--accent-soft);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      color: white;
      font-weight: bold;
      margin: 10px 0;
    }

    .badge-red {
      background-color: #e53935;
    }

    .badge-green {
      background-color: #43a047;
    }

    @media (max-width: 640px) {
      .app {
        padding: 24px;
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>

</head>

<body>
  <div class="app">
    <header>
      <div>
        <h1>Application de prédiction cardio</h1>
        <p>Entrez vos données et utilisez votre modèle pour estimer le risque cardiovasculaire.</p>
      </div>
      <div class="tag">Modèle prêt</div>
    </header>

    <form id="predictionForm">
      <div class="card-grid">
        <div class="field">
          <label for="age">Âge (années)</label>
          <input type="number" id="age" name="age" min="1" max="120" value="45" required>
        </div>
        <div class="field">
          <label for="weight">Poids (kg)</label>
          <input type="number" id="weight" name="weight" min="30" max="250" step="0.1" value="70" required>
        </div>
        <div class="field">
          <label for="ap_hi">Tension systolique (mm Hg)</label>
          <input type="number" id="ap_hi" name="ap_hi" min="80" max="250" value="120" required>
        </div>
        <div class="field">
          <label for="ap_lo">Tension diastolique (mm Hg)</label>
          <input type="number" id="ap_lo" name="ap_lo" min="40" max="200" value="80" required>
        </div>
        <div class="field">
          <label for="cholesterol">Cholestérol</label>
          <select id="cholesterol" name="cholesterol" required>
            <option value="">Sélectionner...</option>
            <option value="1">1 - Normal</option>
            <option value="2">2 - Élevé</option>
            <option value="3">3 - Très élevé</option>
          </select>
        </div>
        <div class="field">
          <label for="gluc">Glucose</label>
          <select id="gluc" name="gluc" required>
            <option value="">Sélectionner...</option>
            <option value="1">1 - Normal</option>
            <option value="2">2 - Élevé</option>
            <option value="3">3 - Très élevé</option>
          </select>
        </div>
      </div>

      <button type="submit">Lancer la prédiction</button>
    </form>

    <div class="result" id="result">
      <h2>Prêt à analyser</h2>
      <p>Remplissez le formulaire et cliquez sur le bouton pour obtenir une estimation de risque.</p>
    </div>
  </div>

  <script>
    const form = document.getElementById('predictionForm');
    const result = document.getElementById('result');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const formData = new FormData(form);
      const payload = {};
      formData.forEach((value, key) => {
        payload[key] = isNaN(value) ? value : Number(value);
      });


      result.innerHTML = '<span class="loading">Analyse en cours... merci de patienter.</span>';


      try {
        const response = await fetch('http://127.0.0.1:8000/predict', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify(payload),
        });

        console.log("Données envoyées :", payload);
        console.log("Réponse brute :", response);

        if (!response.ok) {
          throw new Error('Erreur lors de la prédiction');
        }

        const data = await response.json();
        const score = data.probability;
        const risk = score > 0.5 ? 'Risque élevé' : 'Risque modéré à faible';
        const description = score > 0.5
          ? 'Votre profil indique un niveau de risque cardiovasculaire plus élevé. Consultez un spécialiste pour des conseils personnalisés.'
          : 'Votre profil semble relativement stable, mais il est recommandé de maintenir de bonnes habitudes de vie.';

        const badge = score > 0.5 ? 'risque de cardio' : 'pas de risque de cardio';

        const badgeClass = score > 0.5 ? 'badge-red' : 'badge-green';

        result.innerHTML = `
        <h2>${risk}</h2>
        <p class="badge ${badgeClass}">${badge}</p>
        <p>${description}</p>
        <p>Score estimé : <strong>${data.probability.toFixed(2)}</strong></p>
      `;
      } catch (error) {
        result.innerHTML = `
          <h2>Erreur</h2>
          <p>Impossible de contacter l'API : ${error.message}</p>
        `;
      }
    });
  </script>

</body>

</html>
